<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Love · Visuel boutique</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #17100e; }
      .cover { position: relative; isolation: isolate; width: 1080px; height: 1080px; overflow: hidden; color: #fff8ed; background: #372a23; }
      .cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; z-index: -2; }
      .cover::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(22, 13, 13, .76), rgba(40, 22, 18, .35) 35%, rgba(40, 22, 18, .05) 53%, rgba(25, 12, 13, .68) 72%, rgba(25, 12, 13, .95)); }
      .label { position: absolute; top: 65px; left: 0; width: 100%; margin: 0; text-align: center; font: 500 21px/1.4 'Inter', sans-serif; letter-spacing: .29em; color: #e9ce9e; }
      h1 { position: absolute; top: 131px; left: 0; width: 100%; margin: 0; text-align: center; font-weight: 400; }
      h1 span { display: block; font: 300 143px/.95 'Inter', sans-serif; letter-spacing: -.065em; padding-right: 10px; }
      h1 em { display: block; margin-top: -7px; font: italic 400 228px/.83 'Cormorant Garamond', Georgia, serif; letter-spacing: -.055em; padding-right: 20px; }
      .tagline { position: absolute; left: 90px; right: 90px; bottom: 139px; margin: 0; text-align: center; font: 400 41px/1.35 'Inter', sans-serif; letter-spacing: -.035em; text-wrap: balance; }
      .tagline em { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.38em; font-weight: 500; line-height: 1.1; }
      .signature { position: absolute; bottom: 65px; left: 0; width: 100%; margin: 0; text-align: center; font: 400 17px/1.5 'Inter', sans-serif; letter-spacing: .12em; color: #e9ce9e; }
    </style>
  </head>
  <body>
    <main class="cover" aria-label="Visuel carré Team Love">
      <img src="/assets/team-love-poster.jpg?v=son-caroline" alt="Un couple au bord de la mer et ses reflets en surimpression." />
      <p class="label">Love School</p>
      <h1><span>TEAM</span><em>Love</em></h1>
      <p class="tagline">Un guide simple et pratique<br />pour <em>faire équipe</em><br />pendant les conflits.</p>
      <p class="signature">Un enseignement de Caroline Verdier</p>
    </main>
  </body>
</html>
